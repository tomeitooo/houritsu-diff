# Rebuilds the index from Kohei-Wada/houritsu every day and publishes the site.
# To enable: copy to .github/workflows/pages.yml and set Pages to deploy from GitHub Actions.
name: Publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Fetch the law history
        run: |
          git clone --no-tags --single-branch --branch main https://github.com/Kohei-Wada/houritsu.git source/houritsu
          git -C source/houritsu fetch --no-tags origin upcoming:upcoming
      - run: npm run build:data
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
